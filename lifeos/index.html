<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#5b5bd6" />
<title>LifeOS v3.9.4 — Cross-Day Sleep Scheduler</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21V11"/><path d="M12 13C7.6 13 5 10.6 5 6c4.6 0 7 2.4 7 7Z"/><path d="M12 16c4.4 0 7-2.4 7-7-4.6 0-7 2.4-7 7Z"/></svg></span><span class="brand-name">LifeOS</span><small>v3.9.4</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><button class="btn primary" data-action="quick-add-menu" title="Add a task, event, goal, project or habit">Add</button><button class="btn" data-action="command" title="Open the command palette">Command</button></div>
  </aside>
  <section class="main">
    <header class="topbar"><button class="btn menu-btn" data-action="menu" aria-label="Open navigation">Menu</button><div class="page-title-wrap"><div class="page-title" id="pageTitle">Dashboard</div><div class="page-subtitle" id="pageSubtitle">Your day at a glance</div></div><div class="search"><span class="search-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><input id="globalSearch" placeholder="Search LifeOS…" aria-label="Search LifeOS"><kbd>/</kbd><div class="search-results" id="searchResults"></div></div><div class="badge" title="LifeOS is storing your working data locally in this browser"><span class="dot"></span><span id="modeBadge">Offline • Local</span></div></header>
    <main class="content"><div class="quick-capture"><span class="capture-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><input id="quickCapture" placeholder="Quick capture — e.g. Submit report Friday 90 min"><button class="btn primary" data-action="capture">Capture</button></div><div id="view"></div></main>
  </section>
</div>
<div class="mobile-nav" id="mobileNav"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="palette" id="palette"><div class="palette-box"><input id="paletteInput" placeholder="Type a command…"><div class="palette-list" id="paletteList"></div></div></div>
<div class="focus-screen" id="focusScreen"><div class="focus-box"><div class="muted">FOCUS MODE</div><h1 id="focusTitle">Task</h1><div class="timer" id="focusTimer">00:00:00</div><div class="muted" id="focusPlan"></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px"><button class="btn primary" id="focusPause"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg><span>Pause</span></button><button class="btn" id="focusAdd"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>15 min</span></button><button class="btn" id="focusComplete"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m5 12 4 4L19 6"/></svg><span>Complete</span></button><button class="btn danger" id="focusStop"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="10" height="10" rx="1"/></svg><span>Stop</span></button></div></div></div>
<input type="file" id="importInput" accept="application/json" class="hidden" />
<script src="assets/main-00.js"></script>
<script src="assets/main-01.js"></script>
<script src="assets/main-02.js"></script>
<script src="assets/main-03.js"></script>
<script src="assets/main-04.js"></script>
<script src="assets/main-05.js"></script>
<script src="assets/patch-01.js"></script>
<script src="assets/patch-02.js"></script>
<script src="assets/patch-03.js"></script>
<script src="assets/patch-04.js"></script>
<script src="assets/patch-05.js"></script>
<script src="assets/patch-06.js"></script>
<script src="assets/patch-07.js"></script>
<script src="assets/patch-08.js"></script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body>
</html>
