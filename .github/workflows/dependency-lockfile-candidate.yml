name: Prepare secure DocFlow dependency lockfile
on:
  push:
    branches: [fix/docflow-dependency-audit-2026]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade vulnerable lint dependency and remediate lockfile
        run: |
          npm install --save-dev --save-exact typescript-eslint@8.71.2
          npm audit fix
          npm audit --audit-level=high
      - name: Validate secure install
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit verified manifests to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Fix audited npm dependencies without weakening security gates'
            git push origin HEAD:fix/docflow-dependency-audit-2026
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docflow-audited-npm-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
