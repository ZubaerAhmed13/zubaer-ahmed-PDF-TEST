name: Prepare secure DocFlow dependency lockfile
on:
  push:
    branches: [fix/docflow-dependency-audit-2026]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade vulnerable lint dependency and remediate lockfile
        run: |
          npm install --save-dev --save-exact typescript-eslint@8.71.2
          npm audit fix
          npm audit --audit-level=high
      - name: Validate secure install
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docflow-audited-npm-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
