name: Deploy DocFlow Professional to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docflow-pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run verify:provenance
      - run: npm run typecheck
      - run: npm run lint
      - name: Install independent PDF verifier
        run: python -m pip install PyMuPDF==1.26.6
      - run: npm test
      - run: npm run build
      - name: Package reproducible release artifact
        run: |
          npm run release:artifact
          cp artifacts/release/SHA256SUMS /tmp/docflow-first-checksums
          npm run build
          npm run release:artifact
          cmp /tmp/docflow-first-checksums artifacts/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: docflow-release-${{ github.sha }}
          path: artifacts/release/
      - name: Measure fixed OCR corpus
        run: node scripts/benchmark-ocr.mjs
      - name: Retain synthetic preservation baseline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-preservation-baseline
          path: |
            artifacts/r0/
            artifacts/r2/
            artifacts/r4/
            artifacts/r5/
            artifacts/a1/
          if-no-files-found: ignore
      - name: Report production bundle sizes
        run: find dist -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  browser:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: [quality, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@v4

  production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DOCFLOW_PRODUCTION_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed DocFlow with real PDF operations
        run: npm run test:production
      - name: Independently verify published identity and assets
        run: node scripts/check-availability.mjs "$DOCFLOW_PRODUCTION_BASE_URL" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
