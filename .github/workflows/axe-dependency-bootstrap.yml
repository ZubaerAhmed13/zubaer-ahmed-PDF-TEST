name: Add locked axe accessibility dependency

on:
  push:
    branches: [professional-upgrade]

permissions:
  contents: write

concurrency:
  group: docflow-axe-dependency-bootstrap
  cancel-in-progress: false

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add exact local accessibility test dependency
        run: npm install --save-dev --save-exact @axe-core/playwright@4.13.0
      - name: Verify reproducible install and security audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Commit package lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore: lock axe accessibility test dependency"
          git push origin HEAD:professional-upgrade
