name: Phase 3 real OCR browser acceptance
on:
  push:
    branches: [feat/docflow-phase3-local-ocr-pdf-comparison]
permissions:
  contents: read
jobs:
  phase3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and audit pinned models
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate OCR and comparison
        run: npx playwright test e2e/phase3-ocr-comparison.spec.ts --project=${{ matrix.browser }}
