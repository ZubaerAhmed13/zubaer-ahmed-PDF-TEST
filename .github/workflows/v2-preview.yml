name: DocFlow 2.0 isolated UX smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/v2/**'
      - 'src/main.ts'
      - 'e2e/v2-*.spec.ts'
      - 'docs/V2_REBUILD_MASTERPLAN.md'
      - '.github/workflows/v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docflow-v2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - name: New UI journey - only, while legacy parity is migrated
        run: npx playwright test e2e/v2-clean-slate.spec.ts e2e/v2-visual-review.spec.ts e2e/v2-organize-optimize.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docflow-v2-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
            artifacts/v2/screens/
          if-no-files-found: ignore
