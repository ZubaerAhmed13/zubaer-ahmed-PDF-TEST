name: Apply DocFlow migration bootstrap

on:
  push:
    branches: [professional-upgrade]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docflow-migration-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified migration payload
        run: python scripts/apply_migration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit modular migration
        run: |
          rm -f scripts/migration.payload scripts/migration.payload.* scripts/apply_migration.py scripts/bootstrap-trigger*.txt .github/workflows/bootstrap-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: migrate DocFlow to modular professional architecture"
          git push origin HEAD:professional-upgrade
