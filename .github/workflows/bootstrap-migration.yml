name: Apply DocFlow migration hardening

on:
  push:
    branches: [professional-upgrade]
    paths:
      - '.github/workflows/bootstrap-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair lint issues, XFA detection and vulnerable toolchain pins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app = Path('src/app/createApp.ts')
          text = app.read_text()
          old = "      favorites.has(id) ? favorites.delete(id) : favorites.add(id);"
          new = "      if (favorites.has(id)) favorites.delete(id);\n      else favorites.add(id);"
          if old not in text:
              raise SystemExit('createApp replacement target not found')
          app.write_text(text.replace(old, new), encoding='utf-8')

          core = Path('src/pdf/core.ts')
          text = core.read_text()
          old_checkbox = "    else if (field instanceof PDFCheckBox) asBoolean(value) ? field.check() : field.uncheck();"
          new_checkbox = "    else if (field instanceof PDFCheckBox) {\n      if (asBoolean(value)) field.check();\n      else field.uncheck();\n    }"
          if old_checkbox not in text:
              raise SystemExit('checkbox replacement target not found')
          text = text.replace(old_checkbox, new_checkbox)

          old_xfa = "function hasXfa(buffer: ArrayBuffer): boolean {\n  const bytes = new Uint8Array(buffer);\n  const sample = new TextDecoder('latin1').decode(bytes.subarray(0, Math.min(bytes.length, 2_000_000)));\n  return /\\/XFA\\b/.test(sample);\n}"
          new_xfa = "function hasXfa(buffer: ArrayBuffer): boolean {\n  const bytes = new Uint8Array(buffer);\n  const decoder = new TextDecoder('latin1');\n  const chunkSize = 1_048_576;\n  const overlap = 32;\n  for (let start = 0; start < bytes.length; start += chunkSize - overlap) {\n    const end = Math.min(bytes.length, start + chunkSize);\n    if (/\\/XFA\\b/.test(decoder.decode(bytes.subarray(start, end)))) return true;\n    if (end === bytes.length) break;\n  }\n  return false;\n}"
          if old_xfa not in text:
              raise SystemExit('XFA replacement target not found')
          core.write_text(text.replace(old_xfa, new_xfa), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['devDependencies']['@eslint/js'] = '9.39.5'
          package['devDependencies']['eslint'] = '9.39.5'
          package['devDependencies']['@playwright/test'] = '1.62.1'
          package['devDependencies']['vitest'] = '2.1.9'
          package['devDependencies']['vite'] = '6.4.3'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit hardening fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/createApp.ts src/pdf/core.ts package.json package-lock.json
          git commit -m "fix: harden migrated DocFlow core and dependencies"
          git push origin HEAD:professional-upgrade
