name: Processing foundations
on:
  pull_request:
    paths: ['backend/**', 'tests/processingContracts.test.ts', 'supabase/**', '.github/workflows/processing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npx vitest run tests/processingContracts.test.ts
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run typecheck --prefix backend
      - run: npm audit --prefix backend --audit-level=high
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-noto-core fonts-dejavu-core
      - run: python -m pip install --requirement backend/requirements-test.lock
      - run: python -m unittest test_engines.py
        working-directory: backend
      - run: python -m unittest test_acceptance.py
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processing-acceptance
          path: artifacts/processing/
