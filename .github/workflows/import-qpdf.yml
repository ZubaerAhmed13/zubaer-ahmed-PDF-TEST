name: Import pinned qpdf WASM

on:
  push:
    branches: [professional-upgrade]
    paths:
      - .github/workflows/import-qpdf.yml

permissions:
  contents: write

jobs:
  import-qpdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import immutable upstream artifacts
        shell: bash
        env:
          UPSTREAM_COMMIT: c5c1f2d9f378199d1e2d333dbe4ca20e9ff737ad
          EXPECTED_WASM_BLOB: 9731f64b54813b631c07ec46fc2183331de93874
          EXPECTED_JS_BLOB: 49fc48e71447d5b9e1ddafc5f6b748864ec13cca
          EXPECTED_DTS_BLOB: fb251425b8c71271ccd49e1478f5bb5176692819
          EXPECTED_LICENSE_BLOB: d645695673349e3947e8e5ae42332d0ac3164cd7
        run: |
          set -euo pipefail
          mkdir -p src/vendor/qpdf
          base="https://raw.githubusercontent.com/fayazara/pdfstudio/${UPSTREAM_COMMIT}"

          curl --fail --location --retry 3 --output src/vendor/qpdf/qpdf.wasm "${base}/src/wasm/qpdf.wasm"
          curl --fail --location --retry 3 --output src/vendor/qpdf/qpdf.js "${base}/src/wasm/qpdf.js"
          curl --fail --location --retry 3 --output src/vendor/qpdf/qpdf.d.ts "${base}/src/wasm/qpdf.d.ts"
          curl --fail --location --retry 3 --output src/vendor/qpdf/LICENSE.txt "${base}/LICENSE"

          test "$(git hash-object src/vendor/qpdf/qpdf.wasm)" = "$EXPECTED_WASM_BLOB"
          test "$(git hash-object src/vendor/qpdf/qpdf.js)" = "$EXPECTED_JS_BLOB"
          test "$(git hash-object src/vendor/qpdf/qpdf.d.ts)" = "$EXPECTED_DTS_BLOB"
          test "$(git hash-object src/vendor/qpdf/LICENSE.txt)" = "$EXPECTED_LICENSE_BLOB"

          wasm_sha256="$(sha256sum src/vendor/qpdf/qpdf.wasm | awk '{print $1}')"
          js_sha256="$(sha256sum src/vendor/qpdf/qpdf.js | awk '{print $1}')"
          dts_sha256="$(sha256sum src/vendor/qpdf/qpdf.d.ts | awk '{print $1}')"

          cat > src/vendor/qpdf/PROVENANCE.md <<EOF
          # Vendored qpdf WASM provenance

          These files are vendored unchanged from `fayazara/pdfstudio` 0.4.0 at immutable commit:

          `${UPSTREAM_COMMIT}`

          The upstream build script compiles **qpdf 12.3.2** to WebAssembly. Both the wrapper repository and qpdf 12.3.2 are distributed under Apache License 2.0. The full upstream wrapper license is included as `LICENSE.txt`.

          ## Integrity

          | File | Upstream Git blob SHA | SHA-256 |
          | --- | --- | --- |
          | `qpdf.wasm` | `${EXPECTED_WASM_BLOB}` | `${wasm_sha256}` |
          | `qpdf.js` | `${EXPECTED_JS_BLOB}` | `${js_sha256}` |
          | `qpdf.d.ts` | `${EXPECTED_DTS_BLOB}` | `${dts_sha256}` |

          The one-time import workflow verifies every upstream Git blob SHA before the files are committed. No CDN or runtime third-party fetch is required after vendoring.
          EOF

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vendor/qpdf
          git commit -m "chore: vendor pinned qpdf 12.3.2 wasm runtime"
          git push origin HEAD:professional-upgrade
